<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Download RigSize Live</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(135deg, #0891b2, #2563eb);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  p  { font-size: 15px; opacity: .9; margin: 0 0 24px; }
  .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  a.btn {
    display: block;
    background: #fff;
    color: #1e40af;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>RigSize Live</h1>
  <p id="msg">Redirecting you to the store...</p>
  <div class="btns">
    <a class="btn" id="primary" href="https://apps.apple.com/app/apple-store/id6771266857?pt=128920490&ct=meta-carrousel-eng&mt=8">Download on the App Store</a>
    <a class="btn" id="secondary" href="https://play.google.com/store/apps/details?id=com.rigsizelive.app&referrer=utm_source%3Dmeta%26utm_campaign%3Dcarrousel-eng">Get it on Google Play</a>
  </div>
</div>

<script>
(function () {
  var IOS  = 'https://apps.apple.com/app/apple-store/id6771266857?pt=128920490&ct=meta-carrousel-eng&mt=8';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.rigsizelive.app&referrer=utm_source%3Dmeta%26utm_campaign%3Dcarrousel-eng';
  var SITE = 'https://www.rigsizelive.com/';

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  // iPadOS reports as Macintosh with touch; hence the second check.
  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  var primary = document.getElementById('primary');
  var secondary = document.getElementById('secondary');

  if (isAndroid) {
    primary.href = PLAY;
    primary.textContent = 'Get it on Google Play';
    secondary.href = IOS;
    secondary.textContent = 'Download on the App Store';
    location.replace(PLAY);
  } else if (isIOS) {
    location.replace(IOS);
  } else {
    document.getElementById('msg').textContent =
      'Open this page on your phone, or choose below.';
    setTimeout(function () { location.replace(SITE); }, 2500);
  }
})();
</script>
</body>
</html>
